spring:
  application:
    name: kkr-hms-backend

  datasource:
    # Supabase Postgres (session pooler). Username/password are kept out of the URL.
    url: ${POSTGRES_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres}
    username: ${POSTGRES_USER:postgres.bmbbifxkjqmdqriootdw}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      # PgBouncer-friendly: don't cache server-side prepared statements
      data-source-properties:
        prepareThreshold: 0

  jpa:
    hibernate:
      # Never let Hibernate touch the schema — it must match the live Supabase DB.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false
    show-sql: false

  servlet:
    multipart:
      max-file-size: 11MB
      max-request-size: 12MB

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-ttl-seconds: 600        # 10 minutes
    refresh-token-ttl-seconds: 604800    # 7 days
  cookies:
    domain: ${COOKIE_DOMAIN:}            # e.g. .pritamrao.tech in prod; empty for localhost
    secure: ${COOKIE_SECURE:false}       # true in prod (https)
    same-site: ${COOKIE_SAME_SITE:Lax}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  frontend-url: ${APP_FRONTEND_URL:http://localhost:5173}
  default-password: ${DEFAULT_PASSWORD:Welcome@123}

  r2:
    account-id: ${R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket: ${R2_BUCKET_NAME:kkr-hms}

  brevo:
    api-key: ${BREVO_API_KEY:}
    sender-email: ${BREVO_SENDER_EMAIL:noreply@kkrhospital.com}
    sender-name: ${BREVO_SENDER_NAME:KKR Hospital}

logging:
  level:
    org.springframework.security: INFO
    tech.pritamrao.kkrhms: DEBUG
