# Frontend — hms.pritamrao.tech (React SPA served as static files)
# Place at /etc/nginx/sites-available/hms and symlink into sites-enabled.
# Certbot will inject the SSL/443 server block automatically.
server {
    listen 80;
    server_name hms.pritamrao.tech;

    root /var/www/hms;
    index index.html;

    # SPA fallback — every route resolves to index.html (React Router handles it).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
