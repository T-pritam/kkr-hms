# Backend — api-hms.pritamrao.tech (reverse proxy to the Spring Boot app on :8080)
# Place at /etc/nginx/sites-available/api-hms and symlink into sites-enabled.
# Certbot will inject the SSL/443 server block automatically.
server {
    listen 80;
    server_name api-hms.pritamrao.tech;

    client_max_body_size 12M;   # allow case-sheet PDF uploads (10MB + overhead)

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket/upgrade support (not required today, harmless to keep).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
